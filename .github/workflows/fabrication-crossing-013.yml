name: FABRICATION-CROSSING-013 — signed sovereign printer proposal field
on:
  push:
    branches: [experiment/fabrication-crossing-013]
  pull_request:
    paths:
      - "question_first/fabrication_request.py"
      - "scripts/static-fabrication-request.py"
      - "fixtures/fabrication-013/**"
      - "tests/test_fabrication_request_013.py"
      - ".github/workflows/fabrication-crossing-013.yml"
permissions:
  contents: read
jobs:
  native-design:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install actual OCCT kernel
        run: python3 -m pip install cadquery==2.8.0 cryptography
      - name: Install actual PrusaSlicer FFF slice engine and virtual framebuffer
        run: |
          sudo apt-get update
          sudo apt-get install -y prusa-slicer xvfb xauth
          command -v prusa-slicer
      - name: Checkout frozen GHoT instrument owner
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: 6e4aab6aec3b28f8dd50d01c3d571ae754c653d1
          path: external/GHoT
          persist-credentials: false
      - name: Checkout native reLATTE signer/verifier
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: dcc8cdca84c440aa4294134f020fb7095bf87f24
          path: external/reLATTE
          persist-credentials: false
      - name: Install native reLATTE
        working-directory: external/reLATTE
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build source-constrained design and actual OCCT STEP
        env:
          GHOT_SRC: ${{ github.workspace }}/external/GHoT
          GHOT_HOME: ${{ runner.temp }}/cad010-ghot
          GHOT_ADAPTER_MANIFESTS: ${{ github.workspace }}/integrations/apparatus-002/adapter-manifest.json
        run: |
          python3 scripts/apparatus-compiler.py compile --ghot-root "$GHOT_SRC" --seed fixtures/apparatus-002/source-grounded-question.json --out /tmp/cad010-parent.json
          python3 scripts/static-cad.py compile --apparatus-plan /tmp/cad010-parent.json --parameters fixtures/static-cad-003/reference-parameters.json --candidate gear-then-screw --out-dir dist/cad010-cad-parent
          python3 -c 'import json; p=json.load(open("dist/cad010-cad-parent/project.json")); s=json.load(open("fixtures/static-cad-004/rounded-mount-sketch.json")); s["cad_parent_id"]=p["project_id"];json.dump(s,open("/tmp/cad010-seed.json","w"))'
          python3 scripts/static-sketch.py solve --seed /tmp/cad010-seed.json --parent-project dist/cad010-cad-parent/project.json --out-dir dist/cad010-sketch
          python3 scripts/static-solid.py build --sketch dist/cad010-sketch/sketch.json --out-dir dist/cad010-real-solid
          python3 scripts/static-solid.py cross --out-dir dist/cad010-real-solid --private-relatte-root "$RUNNER_TEMP/cad010-private-keys"
          python3 scripts/static-solid.py verify --out-dir dist/cad010-real-solid
      - name: Cold export and rerun signature verifier without building new solids
        run: |
          python3 scripts/static-design-capacity.py export --family STATIC_CAD_005 --package dist/cad010-real-solid --out dist/cad010-design-capacity.json
          python3 scripts/static-design-capacity.py verify --family STATIC_CAD_005 --package dist/cad010-real-solid --out dist/cad010-design-capacity.json
      - name: Hostile tests against genuine native signed evidence
        env:
          STATIC_OS_CAD010_PACKAGE: ${{ github.workspace }}/dist/cad010-real-solid
        run: python3 -m unittest tests.test_regenerative_design_capacity_010 -v
      - name: Checkout pinned Jubilee 010 draft integration
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Jubilee-treasury
          ref: dcf6ac7e8dbc487a83612e552a43ba5edc577fb5
          path: external/Jubilee-treasury
          persist-credentials: false
      - name: Native Static OS signed CAD evidence → Jubilee reviewed noncash capacity
        working-directory: external/Jubilee-treasury
        env:
          NATIVE_CAD010_EXPORT: ${{ github.workspace }}/dist/cad010-design-capacity.json
          RELATTE_ROOT: ${{ github.workspace }}/external/reLATTE
        run: |
          npm test
          node src/regenerative-cad-demo-010.mjs "$NATIVE_CAD010_EXPORT"
      - name: Real slicer generates actual FDM G-code (no printer connected)
        run: |
          xvfb-run -a python3 scripts/static-print.py slice --source dist/cad010-real-solid --packet dist/print011-held
          xvfb-run -a python3 scripts/static-print.py verify --source dist/cad010-real-solid --packet dist/print011-held
      - name: Diagnostic only — identify slicer dialect on preflight HOLD
        if: failure()
        run: |
          if test -f dist/print011-held/toolpath.gcode; then
            echo "G-code command families actually emitted by pinned slicer:"
            awk '{sub(/;.*/, ""); if ($1 ~ /^[GMT][0-9]+$/) print $1}' dist/print011-held/toolpath.gcode | sort -u | head -60
          fi
      - name: Hostile physical printing boundary tests
        env:
          STATIC_OS_PRINT011_CAD: ${{ github.workspace }}/dist/cad010-real-solid
        run: xvfb-run -a python3 -m unittest tests.test_print_packet_011 -v
      - name: Native CAD and real sliced packet → twelve machine compatibility field
        env:
          STATIC_OS_PRINT012_SOURCE: ${{ github.workspace }}/dist/cad010-real-solid
          STATIC_OS_PRINT012_PACKET: ${{ github.workspace }}/dist/print011-held
        run: |
          python3 scripts/static-printer-field.py catalog
          python3 -m unittest tests.test_printer_field_012 -v
          python3 scripts/static-printer-field.py discover \
            --source dist/cad010-real-solid \
            --print-packet dist/print011-held \
            --fleet fixtures/printer-field-012/synthetic-fleet.json \
            --out dist/all-printers-012.json
          python3 scripts/static-printer-field.py verify \
            --source dist/cad010-real-solid \
            --print-packet dist/print011-held \
            --fleet fixtures/printer-field-012/synthetic-fleet.json \
            --out dist/all-printers-012.json
      - name: Static OS native source → exact signed-crossing-selected fabrication request
        env:
          STATIC_OS_PRINT013_SOURCE: ${{ github.workspace }}/dist/cad010-real-solid
          STATIC_OS_PRINT013_PACKET: ${{ github.workspace }}/dist/print011-held
        run: |
          python3 -m unittest tests.test_fabrication_request_013 -v
          python3 scripts/static-fabrication-request.py propose \
            --source dist/cad010-real-solid \
            --packet dist/print011-held \
            --fleet fixtures/printer-field-012/synthetic-fleet.json \
            --selection fixtures/fabrication-013/three-node-selection.json \
            --out dist/fabrication-request-013.json
          python3 scripts/static-fabrication-request.py verify \
            --source dist/cad010-real-solid \
            --packet dist/print011-held \
            --fleet fixtures/printer-field-012/synthetic-fleet.json \
            --selection fixtures/fabrication-013/three-node-selection.json \
            --out dist/fabrication-request-013.json
      - name: Checkout native reLATTE dynamic owner world and fabrication adapter
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: ded308b463df4eda2003000b4202d3c7aaa2dc84
          path: external/reLATTE-013
          persist-credentials: false
          fetch-depth: 0
      - name: Install native signed reLATTE experimental world dependencies
        working-directory: external/reLATTE-013
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Signed owner worlds and forged-grant adversarial regressions
        working-directory: external/reLATTE-013
        run: node --test experiments/fabrication-crossing-013/tests/*.test.mjs
      - name: Independently keyed machine decisions against exact signed Static OS source
        working-directory: external/reLATTE-013
        run: |
          node experiments/fabrication-crossing-013/run.mjs \
            "${{ github.workspace }}/dist/fabrication-request-013.json" \
            "${{ github.workspace }}/dist/fabrication-relatte-013"
      - name: Reconstruct historical owner keys, withdrawn offers and fresh proposal ticket without native execution
        working-directory: external/reLATTE-013
        run: |
          node experiments/fabrication-crossing-013/verify-run.mjs \
            "${{ github.workspace }}/dist/fabrication-relatte-013/proof.json" \
            "${{ github.workspace }}/dist/fabrication-relatte-013/trust-pins.json"
      - name: Assert no physical fabrication or Treasury machine inventory claim
        run: |
          python3 - <<'PY'
          import json
          request=json.load(open("dist/fabrication-request-013.json"))
          proof=json.load(open("dist/fabrication-relatte-013/proof.json"))
          assert request["physical_parts"]==0
          assert proof["claims"]["physical_parts"]==0
          assert proof["claims"]["jubilee_physical_inventory_delta"]==0
          assert proof["claims"]["grants_for_physical_print"]==0
          assert proof["claims"]["machine_dispatched"] is False
          assert proof["fresh_ticket"]["operation"]=="propose"
          print("NO_PHYSICAL_MACHINE_AUTHORITY")
          PY
      - name: Evidence exported, no printer transmission or machine grant
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("dist/print011-held/packet.json"))
          assert p["machine_motion_executed"] is False
          assert p["printer_connected"] is False
          assert p["physical_output_created"] is False
          assert p["transmission_enabled"] is False
          print("PRINT_PACKET_HOLD",p["packet_id"])
          PY
      - name: Upload public source package and capacity candidate, never private keys
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-crossing-013-signed-three-worlds
          path: |
            dist/cad010-real-solid/
            dist/cad010-design-capacity.json
            dist/print011-held/
            dist/all-printers-012.json
            dist/fabrication-request-013.json
            dist/fabrication-relatte-013/
          retention-days: 14
          if-no-files-found: error
