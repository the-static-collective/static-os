name: GENESIS-001 contract
on:
  push:
  pull_request:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate manifest
        run: python3 scripts/validate-manifest.py manifest/genesis-001.json
      - name: Validate script syntax
        run: |
          bash -n scripts/build-iso.sh
          bash -n scripts/roadkit-setup.sh
          bash -n scripts/roadkit.sh
          python3 -m py_compile scripts/physical-boot-receipt.py
          sh -n config/hooks/live/010-install-house.hook.chroot
          sh -n config/includes.chroot/usr/local/bin/static-house-launch
          sh -n config/includes.chroot/usr/local/bin/static-elf-proof
      - name: Run hostile manifest tests
        run: python3 -m unittest discover -s tests -v
      - name: Run exact-pinned offline ELF carrier smoke (host only, not ISO/VM proof)
        run: |
          set -eu
          HOUSE_SHA="$(python3 -c 'import json; print(json.load(open("manifest/genesis-001.json"))["house"]["commit"])')"
          mkdir .ci-workbench
          git -C .ci-workbench init -q
          git -C .ci-workbench remote add origin https://github.com/the-static-collective/static-workbench.git
          git -C .ci-workbench fetch --depth=1 origin "$HOUSE_SHA"
          test "$(git -C .ci-workbench rev-parse FETCH_HEAD)" = "$HOUSE_SHA"
          git -C .ci-workbench checkout -q --detach "$HOUSE_SHA"
          PYTHONPATH="$PWD/.ci-workbench" python3 -m static_workbench.elf_genesis demo > elf-host-smoke.json
          python3 -c 'import json; d=json.load(open("elf-host-smoke.json")); assert d["first_verified"] and d["second_verified"] and d["distinct_occurrences"]; assert d["live_provider_conformance"] == "NOT_RUN" and d["os_image_boot"] == "NOT_RUN"'
      - name: Verify exact-pinned Launchpad and HOUSE UI (host-only test)
        run: |
          set -eu
          python3 -m venv .ci-launchpad-venv
          .ci-launchpad-venv/bin/python -m pip install --disable-pip-version-check -e "$PWD/.ci-workbench[dev]"
          PYTHONPATH="$PWD/.ci-workbench" .ci-launchpad-venv/bin/python -m pytest -q             .ci-workbench/tests/test_launchpad.py .ci-workbench/tests/test_ui.py
          node --check .ci-workbench/static_workbench/web/launchpad.js
          node --check .ci-workbench/static_workbench/web/app.js
      - name: Ensure offline HOUSE source has a declared exact owner SHA
        run: |
          test -r manifest/genesis-001.json
          test -r config/includes.chroot/etc/systemd/user/static-workbench.service
          test -r config/includes.chroot/etc/skel/.config/static-workbench/config.toml
          test -r config/includes.chroot/etc/xdg/autostart/static-house.desktop
          test -r config/includes.chroot/usr/local/bin/static-elf-proof

  living-codex-endpoint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read exact Living Codex donor pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('manifest/living-codex-endpoint-001.json'))
          print('relatte='+data['organs']['relatte']['commit'])
          print('roroomom='+data['organs']['roroomom']['commit'])
          print('tranchnode='+data['organs']['tranchnode']['commit'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: ${{ steps.pins.outputs.relatte }}
          path: .ci-relatte
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/ROroomOM
          ref: ${{ steps.pins.outputs.roroomom }}
          path: .ci-roroomom
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/tranchnode
          ref: ${{ steps.pins.outputs.tranchnode }}
          path: .ci-tranchnode
      - name: Verify exact donor commits
        shell: bash
        run: |
          test "$(git -C .ci-relatte rev-parse HEAD)" = "${{ steps.pins.outputs.relatte }}"
          test "$(git -C .ci-roroomom rev-parse HEAD)" = "${{ steps.pins.outputs.roroomom }}"
          test "$(git -C .ci-tranchnode rev-parse HEAD)" = "${{ steps.pins.outputs.tranchnode }}"
      - name: Install donor proof dependencies
        run: |
          npm install --prefix .ci-relatte --package-lock=false --no-audit --no-fund
          npm ci --prefix .ci-tranchnode
      - name: Verify reLATTE donor
        run: npm run verify --prefix .ci-relatte
      - name: Verify TranchNode donor
        run: npm run check --prefix .ci-tranchnode
      - name: Verify ROroomOM Guest Port donor
        run: |
          node --check .ci-roroomom/experiments/relatte-com5-room-001/room.mjs
          node .ci-roroomom/experiments/relatte-com5-room-001/test.mjs
      - name: Run two-house Living Codex endpoint
        shell: bash
        run: |
          set -eu
          OUT="$RUNNER_TEMP/living-codex-endpoint-001"
          rm -rf "$OUT"
          .ci-tranchnode/node_modules/.bin/tsx \
            interop/living-codex-endpoint-001.ts \
            "$PWD/.ci-relatte" \
            "$PWD/.ci-roroomom" \
            "$PWD/.ci-tranchnode" \
            "$OUT" \
            > living-codex-endpoint-001.log
          test -s "$OUT/living-codex-endpoint-001-proof.json"
      - name: Assert endpoint proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          path=os.path.join(os.environ['RUNNER_TEMP'],'living-codex-endpoint-001','living-codex-endpoint-001-proof.json')
          data=json.load(open(path))
          assert data['proof'] == 'PASS'
          inv=data['invariants']
          assert inv['same_foreign_crossing_different_local_consequence'] is True
          assert inv['node_signing_identity_distinct'] is True
          assert inv['shared_history_without_shared_global_state'] is True
          assert inv['foreign_crossing_not_admitted_by_house_b'] is True
          assert inv['human_local_recrossing_required_for_house_b_consequence'] is True
          assert inv['house_b_local_artifacts_absent_from_house_a'] is True
          assert data['houses']['a']['disposition'] == 'ADMIT'
          assert data['houses']['b']['foreign_crossing_disposition'] == 'HOLD'
          assert data['houses']['b']['human_local_disposition'] == 'ADMIT'
          assert data['houses']['a']['state_ref'] != data['houses']['b']['state_ref']
          assert data['transport']['all_attachments_content_address_verified'] is True
          print('LIVING-CODEX-ENDPOINT-001 PASS')
          PY
      - name: Run ROADKIT removable and LAN deployment contract
        shell: bash
        run: |
          set -eu
          OUT="$RUNNER_TEMP/roadkit-001"
          rm -rf "$OUT"
          .ci-tranchnode/node_modules/.bin/tsx \
            interop/roadkit-contract.ts \
            "$PWD/.ci-relatte" \
            "$PWD/.ci-tranchnode" \
            "$OUT" \
            > roadkit-001.log
          test -s "$OUT/roadkit-001-proof.json"
      - name: Assert ROADKIT deployment proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          path=os.path.join(os.environ['RUNNER_TEMP'],'roadkit-001','roadkit-001-proof.json')
          data=json.load(open(path))
          assert data['proof'] == 'PASS'
          inv=data['invariants']
          assert inv['received_not_admitted'] is True
          assert inv['pulled_not_admitted'] is True
          assert inv['foreign_crossing_never_receiver_admitted'] is True
          assert inv['destination_human_recrossing_required'] is True
          assert inv['house_identities_distinct'] is True
          assert inv['shared_history_without_shared_global_state'] is True
          assert inv['durable_receiver_reopen'] is True
          assert data['removable_file']['source_disposition'] == 'ADMIT'
          assert data['removable_file']['receiver_foreign_disposition'] == 'HOLD'
          assert data['lan_http']['source_disposition'] == 'ADMIT'
          assert data['lan_http']['receiver_foreign_disposition'] == 'HOLD'
          assert data['lan_http']['explicit_pull_before_accept'] is True
          assert data['lan_http']['pulled_is_semantic_effect'] is False
          print('ROADKIT-001 PASS')
          PY
      - name: Show endpoint and ROADKIT proofs
        if: always()
        run: |
          cat living-codex-endpoint-001.log || true
          cat roadkit-001.log || true
          if test -f "$RUNNER_TEMP/living-codex-endpoint-001/living-codex-endpoint-001-proof.json"; then
            cat "$RUNNER_TEMP/living-codex-endpoint-001/living-codex-endpoint-001-proof.json"
          fi
          if test -f "$RUNNER_TEMP/roadkit-001/roadkit-001-proof.json"; then
            cat "$RUNNER_TEMP/roadkit-001/roadkit-001-proof.json"
          fi
