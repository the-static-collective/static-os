name: Desktop installer preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['packaging/desktop/**', 'scripts/build-desktop-deb.sh', '.github/workflows/desktop-installer.yml', 'manifest/genesis-001.json']
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build bundled installer and smoke test executable
        run: bash scripts/build-desktop-deb.sh
      - name: Inspect Debian package
        run: dpkg-deb --info dist/static-workbench-desktop_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: static-workbench-zorin-ubuntu-amd64
          path: dist/
          if-no-files-found: error
