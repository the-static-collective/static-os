name: SUITCASE-001 Read-only composition and first-signal contract

on:
  push:
    branches: [experiment/suitcase-genesis-001-mission-composer]
  pull_request:
    paths:
      - 'suitcase/**'
      - 'scripts/suitcase.py'
      - 'scripts/bench-web.py'
      - 'tests/test_suitcase.py'
      - 'tests/test_house_seed.py'
      - 'tests/test_bench_web.py'
      - 'docs/SUITCASE-*.md'
      - 'field/**'
      - '.github/workflows/suitcase-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate finite candidate, tamper refusals and CLI
        run: python3 -m unittest discover -s tests -p 'test_suitcase.py' -v
      - name: Validate read-only local-link HTTP demonstration and LAN refusal gates
        run: python3 -m unittest discover -s tests -p 'test_bench_web.py' -v
      - name: Test reproducible HOUSE-SEED construction, strict claims and refusal
        run: python3 -m unittest discover -s tests -p 'test_house_seed.py' -v
      - name: Compose and cold verify a Living House with all site facts unknown
        run: |
          python3 scripts/suitcase.py house-template > house-site.json
          python3 scripts/suitcase.py house-compose --site house-site.json --profile foundry --media grow --privacy private > living-house.json
          python3 scripts/suitcase.py house-verify living-house.json
          python3 - <<'PY'
          import json
          p=json.load(open('living-house.json'))
          assert p['status']=='HOLD_FOR_SITE_POWER_SAFETY_AND_HUMAN_REVIEW'
          assert not any(p['hardware_effects'].values())
          assert p['outputs']['real_home']=='NOT_BUILT'
          assert p['outputs']['os_image']=='NOT_BUILT'
          assert len(p['modules'])==8 and len(p['stages'])==5
          PY
      - name: Observe CI host only (no root)
        run: python3 scripts/suitcase.py probe
      - name: Compose and cold-verify HOLD-only church offline plan
        run: |
          python3 scripts/suitcase.py compose --profile church --media forest --privacy invitation-only > candidate.json
          python3 scripts/suitcase.py verify candidate.json
          python3 - <<'PY'
          import json
          p=json.load(open('candidate.json'))
          assert p['status']=='HOLD_FOR_BUILD_AND_HUMAN_REVIEW'
          assert not any(p['hardware_effects'].values())
          assert p['federation']['discovery']=='DISABLED'
          assert 'OFFLINE_PACKAGE_CLOSURE_NOT_VERIFIED' in p['holds']
          PY
